<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Task Manager
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<nav class="navbar">

    <a
        class="brand"
        href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}"
    >
        Task Manager
    </a>

    {% if session.get('user_id') %}

    <div class="nav-right">

        <span>
            Hi, {{ session.get('username') }}
        </span>

        <a
            href="{{ url_for('logout') }}"
            class="logout-btn"
        >
            Logout
        </a>

    </div>

    {% endif %}

</nav>


<main class="container">

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

            <div class="flash">
                {{ message }}
            </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    {% block content %}

    {% endblock %}

</main>


<script
    src="{{ url_for('static', filename='js/script.js') }}"
></script>

</body>

</html>
