{% extends "base.html" %}

{% block title %}
Register - Task Manager
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Create Account
    </h1>

    <p class="muted">
        Start managing your tasks.
    </p>


    <form method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Choose username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Choose password"
            required
        >


        <button
            type="submit"
            class="primary-btn"
        >
            Register
        </button>

    </form>


    <p class="switch">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>

</div>

{% endblock %}
